<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registro de Usuario</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --primary: #0f766e;
      --primary-dark: #115e59;
      --error: #b91c1c;
      --ok: #166534;
      --border: #d1d5db;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: radial-gradient(circle at top, #dff7f4 0%, var(--bg) 55%);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      width: min(640px, 100%);
      background: var(--card);
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 22px;
      box-shadow: 0 15px 35px rgba(15, 118, 110, 0.12);
    }

    h1 {
      margin: 0 0 14px;
      font-size: 1.5rem;
    }

    .subtitle {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    label {
      font-weight: 600;
      font-size: 0.9rem;
    }

    input {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s ease;
    }

    input:focus {
      border-color: var(--primary);
    }

    button {
      margin-top: 16px;
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 0.95rem;
      font-weight: 700;
      color: white;
      background: var(--primary);
      cursor: pointer;
      transition: background 0.2s ease;
    }

    button:hover {
      background: var(--primary-dark);
    }

    button:disabled {
      opacity: 0.75;
      cursor: not-allowed;
    }

    .mensaje {
      margin-top: 12px;
      font-size: 0.92rem;
      font-weight: 600;
      min-height: 1.2rem;
    }

    .mensaje.info { color: #1f2937; }
    .mensaje.ok { color: var(--ok); }
    .mensaje.error { color: var(--error); }

    @media (max-width: 700px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Crear cuenta</h1>
    <p class="subtitle">Completa tus datos y registrate en la plataforma.</p>

    <form id="registroForm" novalidate>
      <div class="grid">
        <div class="field full">
          <label for="nombre">Nombre completo</label>
          <input id="nombre" type="text" required />
        </div>

        <div class="field full">
          <label for="correo">Correo</label>
          <input id="correo" type="email" required />
        </div>

        <div class="field full">
          <label for="contrasena">Contraseña</label>
          <input id="contrasena" type="password" minlength="6" required />
        </div>

        <div class="field">
          <label for="cbu">CBU (banco)</label>
          <input id="cbu" type="text" required />
        </div>

        <div class="field">
          <label for="alias">Alias (banco)</label>
          <input id="alias" type="text" required />
        </div>

        <div class="field full">
          <label for="titularCuenta">Titular de la cuenta</label>
          <input id="titularCuenta" type="text" required />
        </div>
      </div>

      <button type="submit">Registrarse</button>
      <p id="mensajeEstado" class="mensaje" aria-live="polite"></p>
    </form>
  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
